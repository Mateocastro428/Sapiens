<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>{% block title %}Sapiens · Historia gamificada por niveles{% endblock %}</title>
  <link rel="icon" href="/static/img/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Cormorant+SC:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/common/base.css">
  <link rel="stylesheet" href="/static/css/common/nav.css">
  <link rel="stylesheet" href="/static/css/common/footer.css">
  <link rel="stylesheet" href="/static/css/common/utilities.css">
  {% block page_styles %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="page">
    {% block nav %}{% include "includes/_nav.html" %}{% endblock %}
    {% block content %}{% endblock %}
    {% include "includes/_footer.html" %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
